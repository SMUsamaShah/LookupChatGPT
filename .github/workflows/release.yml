name: Release

# Builds store-ready ZIPs for the Chrome Web Store and Firefox Add-ons.
#
# Push a tag like v1.73 to cut a release: the ZIPs are attached to a GitHub
# Release for you to download and upload to each store.
#
# Or run it manually from the Actions tab to get the ZIPs as build artifacts
# without creating a release -- useful for testing a build before tagging.

on:
  push:
    tags:
      # This repo tags bare version numbers (1.2, 1.7, 2.0), so match those.
      # The v-prefixed form is accepted too in case you switch conventions.
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Fails the build if a manifest is malformed, references a file that
      # isn't there, or the two manifests disagree on the version.
      - name: Validate and build
        run: python3 scripts/package.py --out dist

      - name: Read manifest version
        id: meta
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest would ship the wrong version
      # number to the stores, so refuse rather than guess which one is right.
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"   # tolerate an optional leading v
          manifest="${{ steps.meta.outputs.version }}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag but manifest.json says $manifest."
            echo "::error::Bump the version in manifest.json and manifest_firefox.json, or retag."
            exit 1
          fi
          echo "Tag matches manifest version $manifest."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      # Handles both ways of tagging:
      #   - `git push origin <tag>`  -> no Release exists yet, so create one.
      #   - Releases UI "Draft a new release" -> tagging and the Release happen
      #     together, so the Release already exists and we just attach the ZIPs.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; attaching ZIPs."
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
